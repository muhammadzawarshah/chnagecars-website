# Reverse proxy in front of one or more API instances (brief sections 3 and 15).
# Put Cloudflare (or another CDN/WAF) in front of this for TLS edge, DDoS protection and caching.

upstream changecars_api {
    least_conn;
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    # server 10.0.0.12:4000 max_fails=3 fail_timeout=10s;   # second API host
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name api.changecars.co.za;

    ssl_certificate     /etc/letsencrypt/live/api.changecars.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.changecars.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;          # images go straight to object storage, never through the API
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location / {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://changecars_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Public, cacheable reads: let the CDN cache them briefly.
    location ~ ^/api/v1/(vehicles|catalogue|content|promotions|seo)(/|$) {
        limit_req zone=api_per_ip burst=120 nodelay;
        proxy_pass http://changecars_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health/live  { proxy_pass http://changecars_api; access_log off; }
    location = /health/ready { proxy_pass http://changecars_api; access_log off; }
}

server {
    listen 80;
    server_name api.changecars.co.za;
    return 301 https://$host$request_uri;
}
