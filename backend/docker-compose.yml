# Local / single-host stack. In production run PostgreSQL and Redis as managed
# services or dedicated hosts, and put a CDN/WAF + load balancer in front of the API.
name: changecars

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: changecars
      POSTGRES_PASSWORD: changecars
      POSTGRES_DB: changecars
      TZ: UTC
      PGTZ: UTC
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changecars"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/changecars-media;
      mc anonymous set download local/changecars-media/media;
      "

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://changecars:changecars@postgres:5432/changecars?schema=public
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://changecars:changecars@postgres:5432/changecars?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      RUN_WORKER_IN_API: "false"
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      replicas: 1

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://changecars:changecars@postgres:5432/changecars?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
